<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý đơn gia sư - Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      .application-card {
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 1.5rem;
        margin-bottom: 1rem;
        transition: all 0.3s ease;
      }
      .application-card:hover {
        border-color: #3b82f6;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .status-badge {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 500;
      }
      .status-pending {
        background: #fef3c7;
        color: #92400e;
      }
      .status-active {
        background: #d1fae5;
        color: #065f46;
      }
      .status-rejected {
        background: #fee2e2;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div th:replace="fragment/header :: header"></div>

    <div class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-user-check me-2"></i>Quản lý đơn gia sư</h2>
        <button class="btn btn-primary" onclick="loadApplications()">
          <i class="fas fa-sync-alt"></i> Làm mới
        </button>
      </div>

      <!-- Filter Tabs -->
      <div class="card mb-4">
        <div class="card-body">
          <ul class="nav nav-pills" id="statusTabs">
            <li class="nav-item">
              <button
                class="nav-link active"
                data-status=""
                onclick="filterByStatus('')"
              >
                Tất cả (<span id="countAll">0</span>)
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                data-status="PENDING_VERIFICATION"
                onclick="filterByStatus('PENDING_VERIFICATION')"
              >
                Chờ duyệt (<span id="countPending">0</span>)
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                data-status="ACTIVE"
                onclick="filterByStatus('ACTIVE')"
              >
                Đã duyệt (<span id="countActive">0</span>)
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                data-status="REJECTED"
                onclick="filterByStatus('REJECTED')"
              >
                Bị từ chối (<span id="countRejected">0</span>)
              </button>
            </li>
          </ul>
        </div>
      </div>

      <!-- Applications List -->
      <div id="applicationsContainer">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Đang tải...</span>
          </div>
          <p class="mt-3">Đang tải danh sách đơn ứng tuyển...</p>
        </div>
      </div>

      <!-- Pagination -->
      <div
        class="d-flex justify-content-center mt-4"
        id="paginationContainer"
        style="display: none"
      >
        <nav>
          <ul class="pagination" id="pagination">
            <!-- Pagination will be rendered here -->
          </ul>
        </nav>
      </div>
    </div>

    <!-- Application Detail Modal -->
    <div class="modal fade" id="applicationDetailModal" tabindex="-1">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Chi tiết đơn ứng tuyển</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="applicationDetailContent">
            <!-- Content will be loaded here -->
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Đóng
            </button>
            <div id="actionButtons">
              <!-- Action buttons will be rendered here -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Confirmation Modal -->
    <div class="modal fade" id="actionConfirmModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="actionModalTitle">
              Xác nhận hành động
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="actionModalBody">
            <!-- Content will be loaded here -->
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Hủy
            </button>
            <button type="button" class="btn btn-primary" id="confirmActionBtn">
              Xác nhận
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div th:replace="fragment/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Admin Tutor Applications JavaScript
      let currentPage = 0;
      const pageSize = 10;
      let totalPages = 0;
      let currentStatus = "";
      let selectedApplicationId = null;
      let pendingAction = null;

      document.addEventListener("DOMContentLoaded", function () {
        checkAuthentication();
        loadApplications();
      });

      function checkAuthentication() {
        const token = getAuthToken();
        if (!token) {
          window.location.href = "/showLogin";
          return;
        }
      }

      async function loadApplications() {
        try {
          showLoading();

          const token = getAuthToken();
          const url = buildApiUrl();

          const response = await fetch(url, {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const data = await response.json();

          if (data.success) {
            renderApplications(data.applications || []);
            updatePagination(data);
            updateStatusCounts(data.applications || []);
          } else {
            showError("Không thể tải danh sách đơn ứng tuyển");
          }
        } catch (error) {
          console.error("Error loading applications:", error);
          showError("Có lỗi xảy ra khi tải đơn ứng tuyển");
        }
      }

      function buildApiUrl() {
        const baseUrl = "/api/admin/tutor-applications";
        const params = new URLSearchParams();

        params.append("page", currentPage);
        params.append("size", pageSize);

        if (currentStatus) {
          params.append("status", currentStatus);
        }

        return `${baseUrl}?${params.toString()}`;
      }

      function renderApplications(applications) {
        const container = document.getElementById("applicationsContainer");

        if (applications.length === 0) {
          container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-inbox fa-4x text-muted mb-3"></i>
                        <h4>Không có đơn ứng tuyển nào</h4>
                        <p class="text-muted">Chưa có đơn ứng tuyển nào phù hợp với bộ lọc hiện tại.</p>
                    </div>
                `;
          return;
        }

        const applicationsHtml = applications
          .map((app) => createApplicationCard(app))
          .join("");
        container.innerHTML = applicationsHtml;
      }

      function createApplicationCard(application) {
        const statusClass = getStatusClass(application.status);
        const statusText = getStatusText(application.status);

        return `
                <div class="application-card">
                    <div class="row align-items-center">
                        <div class="col-md-2 text-center">
                            <img src="${
                              application.tutor?.imageAvatar ||
                              "https://via.placeholder.com/80x80?text=User"
                            }" 
                                 class="rounded-circle" width="80" height="80" alt="Avatar">
                        </div>
                        <div class="col-md-6">
                            <div class="d-flex align-items-center mb-2">
                                <h5 class="mb-0 me-3">
                                    ${application.tutor?.firstName || ""} ${
          application.tutor?.lastName || ""
        }
                                </h5>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <p class="text-muted mb-1">
                                <i class="fas fa-envelope me-2"></i>${
                                  application.tutor?.email || "N/A"
                                }
                            </p>
                            <p class="text-muted mb-1">
                                <i class="fas fa-university me-2"></i>${
                                  application.university || "N/A"
                                } - ${application.major || "N/A"}
                            </p>
                            <p class="text-muted mb-0">
                                <i class="fas fa-money-bill me-2"></i>${(
                                  application.fees || 0
                                ).toLocaleString("vi-VN")} VNĐ/giờ
                            </p>
                        </div>
                        <div class="col-md-2 text-center">
                            <small class="text-muted">Nộp đơn:</small><br>
                            <strong>${formatDate(
                              application.createdAt
                            )}</strong>
                        </div>
                        <div class="col-md-2 text-end">
                            <button class="btn btn-outline-primary btn-sm mb-2" onclick="showApplicationDetail(${
                              application.id
                            })">
                                <i class="fas fa-eye"></i> Chi tiết
                            </button>
                            ${getActionButtons(application)}
                        </div>
                    </div>
                </div>
            `;
      }

      function getActionButtons(application) {
        switch (application.status) {
          case "PENDING_VERIFICATION":
            return `
                        <div class="btn-group-vertical w-100">
                            <button class="btn btn-success btn-sm" onclick="handleAction(${application.id}, 'approve')">
                                <i class="fas fa-check"></i> Duyệt
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="handleAction(${application.id}, 'reject')">
                                <i class="fas fa-times"></i> Từ chối
                            </button>
                        </div>
                    `;
          case "ACTIVE":
            return `
                        <button class="btn btn-warning btn-sm" onclick="handleAction(${application.id}, 'suspend')">
                            <i class="fas fa-pause"></i> Tạm dừng
                        </button>
                    `;
          case "SUSPENDED":
            return `
                        <button class="btn btn-info btn-sm" onclick="handleAction(${application.id}, 'reactivate')">
                            <i class="fas fa-play"></i> Kích hoạt
                        </button>
                    `;
          default:
            return "";
        }
      }

      async function showApplicationDetail(applicationId) {
        try {
          const modalBody = document.getElementById("applicationDetailContent");
          modalBody.innerHTML = `
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary"></div>
                        <p class="mt-2">Đang tải chi tiết...</p>
                    </div>
                `;

          new bootstrap.Modal(
            document.getElementById("applicationDetailModal")
          ).show();

          const token = getAuthToken();
          const response = await fetch(
            `/api/admin/tutor-applications/${applicationId}`,
            {
              headers: {
                Authorization: `Bearer ${token}`,
              },
            }
          );

          const data = await response.json();

          if (data.success) {
            renderApplicationDetail(data.application);
          } else {
            modalBody.innerHTML = `
                        <div class="alert alert-warning">
                            Không thể tải chi tiết đơn ứng tuyển
                        </div>
                    `;
          }
        } catch (error) {
          console.error("Error loading application detail:", error);
          document.getElementById("applicationDetailContent").innerHTML = `
                    <div class="alert alert-danger">
                        Có lỗi xảy ra khi tải chi tiết
                    </div>
                `;
        }
      }

      function renderApplicationDetail(application) {
        const content = document.getElementById("applicationDetailContent");
        content.innerHTML = `
                <div class="row">
                    <div class="col-md-4">
                        <div class="text-center mb-4">
                            <img src="${
                              application.tutor?.imageAvatar ||
                              "https://via.placeholder.com/150x150?text=User"
                            }" 
                                 class="rounded-circle mb-3" width="150" height="150" alt="Avatar">
                            <h5>${application.tutor?.firstName || ""} ${
          application.tutor?.lastName || ""
        }</h5>
                            <span class="badge bg-primary">${
                              application.status
                            }</span>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <h6>Thông tin cá nhân</h6>
                        <table class="table table-borderless table-sm">
                            <tr><td><strong>Email:</strong></td><td>${
                              application.tutor?.email || "N/A"
                            }</td></tr>
                            <tr><td><strong>Số điện thoại:</strong></td><td>${
                              application.phoneNumber || "N/A"
                            }</td></tr>
                            <tr><td><strong>Địa chỉ:</strong></td><td>${
                              application.addressLine1 || "N/A"
                            }</td></tr>
                            <tr><td><strong>Thành phố:</strong></td><td>${
                              application.city || "N/A"
                            }</td></tr>
                        </table>

                        <h6 class="mt-4">Thông tin chuyên môn</h6>
                        <table class="table table-borderless table-sm">
                            <tr><td><strong>Tiêu đề:</strong></td><td>${
                              application.headline || "N/A"
                            }</td></tr>
                            <tr><td><strong>Trường:</strong></td><td>${
                              application.university || "N/A"
                            }</td></tr>
                            <tr><td><strong>Chuyên ngành:</strong></td><td>${
                              application.major || "N/A"
                            }</td></tr>
                            <tr><td><strong>Học phí:</strong></td><td>${(
                              application.fees || 0
                            ).toLocaleString("vi-VN")} VNĐ/giờ</td></tr>
                        </table>

                        ${
                          application.bio
                            ? `
                            <h6 class="mt-4">Giới thiệu</h6>
                            <p>${application.bio}</p>
                        `
                            : ""
                        }

                        ${
                          application.adminNote
                            ? `
                            <h6 class="mt-4">Ghi chú admin</h6>
                            <div class="alert alert-info">${application.adminNote}</div>
                        `
                            : ""
                        }
                    </div>
                </div>
            `;

        // Update action buttons
        const actionButtons = document.getElementById("actionButtons");
        actionButtons.innerHTML = getDetailActionButtons(application);
      }

      function getDetailActionButtons(application) {
        const buttons = [];

        switch (application.status) {
          case "PENDING_VERIFICATION":
            buttons.push(`<button class="btn btn-success me-2" onclick="handleAction(${application.id}, 'approve')">
                        <i class="fas fa-check"></i> Duyệt đơn</button>`);
            buttons.push(`<button class="btn btn-danger" onclick="handleAction(${application.id}, 'reject')">
                        <i class="fas fa-times"></i> Từ chối</button>`);
            break;
          case "ACTIVE":
            buttons.push(`<button class="btn btn-warning" onclick="handleAction(${application.id}, 'suspend')">
                        <i class="fas fa-pause"></i> Tạm dừng</button>`);
            break;
          case "SUSPENDED":
            buttons.push(`<button class="btn btn-info" onclick="handleAction(${application.id}, 'reactivate')">
                        <i class="fas fa-play"></i> Kích hoạt lại</button>`);
            break;
        }

        return buttons.join("");
      }

      function handleAction(applicationId, action) {
        selectedApplicationId = applicationId;
        pendingAction = action;

        const actionTexts = {
          approve: "duyệt đơn ứng tuyển",
          reject: "từ chối đơn ứng tuyển",
          suspend: "tạm dừng gia sư",
          reactivate: "kích hoạt lại gia sư",
        };

        document.getElementById(
          "actionModalTitle"
        ).textContent = `Xác nhận ${actionTexts[action]}`;
        document.getElementById("actionModalBody").innerHTML = `
                <p>Bạn có chắc chắn muốn ${actionTexts[action]} này?</p>
                ${
                  action === "reject"
                    ? '<textarea class="form-control" placeholder="Lý do từ chối (tùy chọn)" id="rejectionReason"></textarea>'
                    : ""
                }
            `;

        new bootstrap.Modal(
          document.getElementById("actionConfirmModal")
        ).show();
      }

      // Event listener for confirm action
      document
        .getElementById("confirmActionBtn")
        .addEventListener("click", async function () {
          try {
            const token = getAuthToken();
            const url = `/api/admin/tutor-applications/${selectedApplicationId}/${pendingAction}`;

            let body = {};
            if (pendingAction === "reject") {
              const reason = document.getElementById("rejectionReason")?.value;
              if (reason) body.note = reason;
            }

            const response = await fetch(url, {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify(body),
            });

            const data = await response.json();

            if (data.success) {
              alert("Thao tác thành công!");
              bootstrap.Modal.getInstance(
                document.getElementById("actionConfirmModal")
              ).hide();
              bootstrap.Modal.getInstance(
                document.getElementById("applicationDetailModal")
              )?.hide();
              loadApplications(); // Reload list
            } else {
              alert("Có lỗi xảy ra: " + data.message);
            }
          } catch (error) {
            console.error("Error performing action:", error);
            alert("Có lỗi xảy ra khi thực hiện thao tác");
          }
        });

      // Filter functions
      function filterByStatus(status) {
        currentStatus = status;
        currentPage = 0;

        // Update active tab
        document.querySelectorAll("#statusTabs .nav-link").forEach((tab) => {
          tab.classList.toggle("active", tab.dataset.status === status);
        });

        loadApplications();
      }

      function updateStatusCounts(applications) {
        const counts = {
          all: applications.length,
          pending: applications.filter(
            (a) => a.status === "PENDING_VERIFICATION"
          ).length,
          active: applications.filter((a) => a.status === "ACTIVE").length,
          rejected: applications.filter((a) => a.status === "REJECTED").length,
        };

        document.getElementById("countAll").textContent = counts.all;
        document.getElementById("countPending").textContent = counts.pending;
        document.getElementById("countActive").textContent = counts.active;
        document.getElementById("countRejected").textContent = counts.rejected;
      }

      function updatePagination(data) {
        totalPages = data.totalPages || 0;
        currentPage = data.currentPage || 0;

        // Implementation similar to other pagination functions
        // ... (simplified for brevity)
      }

      // Utility functions
      function getStatusClass(status) {
        const classes = {
          PENDING_VERIFICATION: "status-pending",
          ACTIVE: "status-active",
          REJECTED: "status-rejected",
        };
        return classes[status] || "status-pending";
      }

      function getStatusText(status) {
        const texts = {
          PENDING_VERIFICATION: "Chờ duyệt",
          ACTIVE: "Đã duyệt",
          REJECTED: "Bị từ chối",
          SUSPENDED: "Tạm dừng",
        };
        return texts[status] || "Không xác định";
      }

      function formatDate(dateStr) {
        if (!dateStr) return "N/A";
        return new Date(dateStr).toLocaleDateString("vi-VN");
      }

      function showLoading() {
        document.getElementById("applicationsContainer").innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-3">Đang tải danh sách đơn ứng tuyển...</p>
                </div>
            `;
      }

      function showError(message) {
        document.getElementById("applicationsContainer").innerHTML = `
                <div class="alert alert-danger text-center">
                    <i class="fas fa-exclamation-circle fa-2x mb-3"></i>
                    <h5>Có lỗi xảy ra</h5>
                    <p>${message}</p>
                    <button class="btn btn-primary" onclick="loadApplications()">
                        <i class="fas fa-redo"></i> Thử lại
                    </button>
                </div>
            `;
      }

      function getAuthToken() {
        return (
          localStorage.getItem("jwt_token") ||
          sessionStorage.getItem("jwt_token")
        );
      }
    </script>
  </body>
</html>
