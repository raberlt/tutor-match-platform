<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký trở thành gia sư - TutorMatch</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --primary-blue: #1e40af;
        --light-blue: #3b82f6;
        --success-green: #10b981;
        --warning-orange: #f59e0b;
        --light-gray: #f8fafc;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--light-gray);
      }

      .form-container {
        background: white;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        padding: 2rem;
        margin: 2rem 0;
      }

      .step-indicator {
        display: flex;
        justify-content: center;
        margin-bottom: 2rem;
      }

      .step {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #e5e7eb;
        color: #6b7280;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 10px;
        font-weight: bold;
      }

      .step.active {
        background: var(--primary-blue);
        color: white;
      }

      .step.completed {
        background: var(--success-green);
        color: white;
      }

      .form-section {
        display: none;
      }

      .form-section.active {
        display: block;
      }

      .subject-checkbox {
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        padding: 10px;
        margin: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .subject-checkbox:hover {
        border-color: var(--primary-blue);
      }

      .subject-checkbox.selected {
        border-color: var(--primary-blue);
        background: #eff6ff;
      }

      .schedule-item {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
      }

      .btn-primary-custom {
        background: var(--primary-blue);
        border: none;
        padding: 12px 30px;
        border-radius: 8px;
        font-weight: 600;
      }

      .alert-custom {
        border-radius: 8px;
        padding: 15px;
      }

      .progress-bar-custom {
        height: 6px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div th:replace="fragment/header :: header"></div>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <!-- Header -->
          <div class="text-center mb-4">
            <h1 class="mb-3">Đăng ký trở thành gia sư</h1>
            <p class="text-muted">
              Chia sẻ kiến thức và kiếm thu nhập từ việc dạy học
            </p>
          </div>

          <!-- Status Check -->
          <div
            id="statusContainer"
            class="form-container"
            style="display: none"
          >
            <div class="alert alert-info">
              <h5><i class="fas fa-info-circle"></i> Trạng thái đăng ký</h5>
              <div id="statusContent"></div>
            </div>
          </div>

          <!-- Step Indicator -->
          <div class="step-indicator">
            <div class="step active" id="step1">1</div>
            <div class="step" id="step2">2</div>
            <div class="step" id="step3">3</div>
            <div class="step" id="step4">4</div>
          </div>

          <!-- Progress Bar -->
          <div class="progress mb-4">
            <div
              class="progress-bar progress-bar-custom bg-primary"
              id="progressBar"
              style="width: 25%"
            ></div>
          </div>

          <!-- Form Container -->
          <div class="form-container">
            <form id="becomeTutorForm">
              <!-- Step 1: Personal Information -->
              <div class="form-section active" id="section1">
                <h4 class="mb-4">Thông tin cá nhân</h4>

                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label class="form-label"
                        >Họ và tên lót <span class="text-danger">*</span></label
                      >
                      <input
                        type="text"
                        class="form-control"
                        id="firstName"
                        required
                      />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label class="form-label"
                        >Tên <span class="text-danger">*</span></label
                      >
                      <input
                        type="text"
                        class="form-control"
                        id="lastName"
                        required
                      />
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label class="form-label">Ngày sinh</label>
                      <input
                        type="date"
                        class="form-control"
                        id="dateOfBirth"
                      />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label class="form-label">Giới tính</label>
                      <select class="form-select" id="gender">
                        <option value="">Chọn giới tính</option>
                        <option value="MALE">Nam</option>
                        <option value="FEMALE">Nữ</option>
                        <option value="OTHER">Khác</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label class="form-label"
                        >Số điện thoại <span class="text-danger">*</span></label
                      >
                      <input
                        type="tel"
                        class="form-control"
                        id="phoneNumber"
                        required
                      />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label class="form-label"
                        >Thành phố <span class="text-danger">*</span></label
                      >
                      <input
                        type="text"
                        class="form-control"
                        id="city"
                        required
                      />
                    </div>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Địa chỉ</label>
                  <input type="text" class="form-control" id="addressLine1" />
                </div>
              </div>

              <!-- Step 2: Professional Information -->
              <div class="form-section" id="section2">
                <h4 class="mb-4">Thông tin chuyên môn</h4>

                <div class="mb-3">
                  <label class="form-label"
                    >Tiêu đề hồ sơ <span class="text-danger">*</span></label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="headline"
                    placeholder="VD: Gia sư Toán - Lý - Hóa có 5 năm kinh nghiệm"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label"
                    >Giới thiệu bản thân
                    <span class="text-danger">*</span></label
                  >
                  <textarea
                    class="form-control"
                    id="bio"
                    rows="4"
                    placeholder="Hãy giới thiệu về bản thân, phương pháp dạy, và thành tích của bạn..."
                    required
                  ></textarea>
                </div>

                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label class="form-label"
                        >Trường đại học
                        <span class="text-danger">*</span></label
                      >
                      <input
                        type="text"
                        class="form-control"
                        id="university"
                        required
                      />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label class="form-label"
                        >Chuyên ngành <span class="text-danger">*</span></label
                      >
                      <input
                        type="text"
                        class="form-control"
                        id="major"
                        required
                      />
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label class="form-label">Trình độ học vấn</label>
                      <select class="form-select" id="educationLevel">
                        <option value="">Chọn trình độ</option>
                        <option value="Đại học">Đại học</option>
                        <option value="Thạc sĩ">Thạc sĩ</option>
                        <option value="Tiến sĩ">Tiến sĩ</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label class="form-label"
                        >Học phí (VNĐ/giờ)
                        <span class="text-danger">*</span></label
                      >
                      <input
                        type="number"
                        class="form-control"
                        id="fees"
                        min="50000"
                        step="10000"
                        required
                      />
                    </div>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Kinh nghiệm dạy học</label>
                  <textarea
                    class="form-control"
                    id="experience"
                    rows="3"
                    placeholder="Mô tả kinh nghiệm dạy học của bạn..."
                  ></textarea>
                </div>

                <div class="mb-3">
                  <label class="form-label">Đối tượng dạy học</label>
                  <input
                    type="text"
                    class="form-control"
                    id="teachingLevel"
                    placeholder="VD: Học sinh THCS, THPT, Sinh viên năm nhất"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label"
                    >Video giới thiệu (URL YouTube)</label
                  >
                  <input
                    type="url"
                    class="form-control"
                    id="videoIntro"
                    placeholder="https://youtube.com/watch?v=..."
                  />
                </div>
              </div>

              <!-- Step 3: Subjects & Schedule -->
              <div class="form-section" id="section3">
                <h4 class="mb-4">Môn học và lịch dạy</h4>

                <!-- Subjects -->
                <div class="mb-4">
                  <label class="form-label"
                    >Môn học bạn có thể dạy
                    <span class="text-danger">*</span></label
                  >
                  <div id="subjectsContainer" class="row">
                    <!-- Subjects will be loaded here -->
                  </div>
                </div>

                <!-- Schedule -->
                <div class="mb-4">
                  <label class="form-label"
                    >Lịch rảnh trong tuần
                    <span class="text-danger">*</span></label
                  >
                  <div id="scheduleContainer">
                    <div class="schedule-item">
                      <div class="row align-items-center">
                        <div class="col-md-3">
                          <select class="form-select" name="dayOfWeek">
                            <option value="MONDAY">Thứ 2</option>
                            <option value="TUESDAY">Thứ 3</option>
                            <option value="WEDNESDAY">Thứ 4</option>
                            <option value="THURSDAY">Thứ 5</option>
                            <option value="FRIDAY">Thứ 6</option>
                            <option value="SATURDAY">Thứ 7</option>
                            <option value="SUNDAY">Chủ nhật</option>
                          </select>
                        </div>
                        <div class="col-md-3">
                          <input
                            type="time"
                            class="form-control"
                            name="fromTime"
                            value="08:00"
                          />
                        </div>
                        <div class="col-md-3">
                          <input
                            type="time"
                            class="form-control"
                            name="toTime"
                            value="10:00"
                          />
                        </div>
                        <div class="col-md-2">
                          <div class="form-check">
                            <input
                              class="form-check-input"
                              type="checkbox"
                              name="enable"
                              checked
                            />
                            <label class="form-check-label">Có sẵn</label>
                          </div>
                        </div>
                        <div class="col-md-1">
                          <button
                            type="button"
                            class="btn btn-outline-danger btn-sm"
                            onclick="removeScheduleItem(this)"
                          >
                            <i class="fas fa-trash"></i>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                  <button
                    type="button"
                    class="btn btn-outline-primary mt-2"
                    onclick="addScheduleItem()"
                  >
                    <i class="fas fa-plus"></i> Thêm khung giờ
                  </button>
                </div>
              </div>

              <!-- Step 4: Education & Certificates -->
              <div class="form-section" id="section4">
                <h4 class="mb-4">Bằng cấp và chứng chỉ</h4>

                <!-- Education -->
                <div class="mb-4">
                  <label class="form-label">Bằng cấp</label>
                  <div id="educationContainer">
                    <div class="education-item border rounded p-3 mb-3">
                      <div class="row">
                        <div class="col-md-6">
                          <label class="form-label">Tên trường</label>
                          <input
                            type="text"
                            class="form-control"
                            name="schoolName"
                          />
                        </div>
                        <div class="col-md-6">
                          <label class="form-label">Bằng cấp</label>
                          <input
                            type="text"
                            class="form-control"
                            name="degree"
                          />
                        </div>
                      </div>
                      <div class="row mt-2">
                        <div class="col-md-4">
                          <label class="form-label">Chuyên ngành</label>
                          <input
                            type="text"
                            class="form-control"
                            name="major"
                          />
                        </div>
                        <div class="col-md-3">
                          <label class="form-label">Năm bắt đầu</label>
                          <input
                            type="number"
                            class="form-control"
                            name="fromTime"
                            min="1990"
                            max="2030"
                          />
                        </div>
                        <div class="col-md-3">
                          <label class="form-label">Năm tốt nghiệp</label>
                          <input
                            type="number"
                            class="form-control"
                            name="toTime"
                            min="1990"
                            max="2030"
                          />
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                          <button
                            type="button"
                            class="btn btn-outline-danger"
                            onclick="removeEducationItem(this)"
                          >
                            <i class="fas fa-trash"></i>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                  <button
                    type="button"
                    class="btn btn-outline-primary"
                    onclick="addEducationItem()"
                  >
                    <i class="fas fa-plus"></i> Thêm bằng cấp
                  </button>
                </div>

                <!-- Certificates -->
                <div class="mb-4">
                  <label class="form-label">Chứng chỉ</label>
                  <div id="certificateContainer">
                    <div class="certificate-item border rounded p-3 mb-3">
                      <div class="row">
                        <div class="col-md-6">
                          <label class="form-label">Tên chứng chỉ</label>
                          <input type="text" class="form-control" name="name" />
                        </div>
                        <div class="col-md-4">
                          <label class="form-label">Đơn vị cấp</label>
                          <input
                            type="text"
                            class="form-control"
                            name="issuedBy"
                          />
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                          <button
                            type="button"
                            class="btn btn-outline-danger"
                            onclick="removeCertificateItem(this)"
                          >
                            <i class="fas fa-trash"></i>
                          </button>
                        </div>
                      </div>
                      <div class="mt-2">
                        <label class="form-label">Mô tả</label>
                        <textarea
                          class="form-control"
                          name="description"
                          rows="2"
                        ></textarea>
                      </div>
                    </div>
                  </div>
                  <button
                    type="button"
                    class="btn btn-outline-primary"
                    onclick="addCertificateItem()"
                  >
                    <i class="fas fa-plus"></i> Thêm chứng chỉ
                  </button>
                </div>
              </div>

              <!-- Navigation Buttons -->
              <div class="d-flex justify-content-between mt-4">
                <button
                  type="button"
                  class="btn btn-secondary"
                  id="prevBtn"
                  onclick="changeStep(-1)"
                  style="display: none"
                >
                  <i class="fas fa-arrow-left"></i> Trước
                </button>
                <button
                  type="button"
                  class="btn btn-primary-custom"
                  id="nextBtn"
                  onclick="changeStep(1)"
                >
                  Tiếp theo <i class="fas fa-arrow-right"></i>
                </button>
                <button
                  type="submit"
                  class="btn btn-success"
                  id="submitBtn"
                  style="display: none"
                >
                  <i class="fas fa-paper-plane"></i> Gửi đăng ký
                </button>
              </div>
            </form>
          </div>

          <!-- Loading Modal -->
          <div
            class="modal fade"
            id="loadingModal"
            data-bs-backdrop="static"
            data-bs-keyboard="false"
          >
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content">
                <div class="modal-body text-center py-4">
                  <div class="spinner-border text-primary mb-3"></div>
                  <h5>Đang xử lý đăng ký...</h5>
                  <p class="text-muted">Vui lòng chờ trong giây lát</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div th:replace="fragment/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // JavaScript cho form đăng ký gia sư
      let currentStep = 1;
      const totalSteps = 4;
      let selectedSubjects = [];

      // Check authentication and status on page load
      document.addEventListener("DOMContentLoaded", function () {
        checkApplicationStatus();
        loadSubjects();
      });

      async function checkApplicationStatus() {
        try {
          const token = getAuthToken();
          if (!token) {
            window.location.href = "/showLogin";
            return;
          }

          const response = await fetch("/api/student/become-tutor/status", {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const data = await response.json();

          if (data.success && data.hasApplication) {
            showApplicationStatus(data);
          }
        } catch (error) {
          console.error("Error checking status:", error);
        }
      }

      function showApplicationStatus(data) {
        const statusContainer = document.getElementById("statusContainer");
        const statusContent = document.getElementById("statusContent");

        let statusHtml = "";
        let statusClass = "";

        switch (data.status) {
          case "PENDING_VERIFICATION":
            statusClass = "alert-warning";
            statusHtml = `
                        <p><strong>Trạng thái:</strong> <span class="badge bg-warning">Chờ duyệt</span></p>
                        <p>Đơn ứng tuyển của bạn đang được admin xem xét. Chúng tôi sẽ phản hồi trong vòng 24-48 giờ.</p>
                        <a href="#" onclick="loadApplicationDetails()" class="btn btn-sm btn-outline-primary">Xem chi tiết đăng ký</a>
                    `;
            break;
          case "ACTIVE":
            statusClass = "alert-success";
            statusHtml = `
                        <p><strong>Trạng thái:</strong> <span class="badge bg-success">Đã được duyệt</span></p>
                        <p>Chúc mừng! Bạn đã trở thành gia sư của TutorMatch. Hãy bắt đầu nhận học viên ngay.</p>
                        <a href="/teaching-schedule" class="btn btn-sm btn-success">Đến trang gia sư</a>
                    `;
            break;
          case "REJECTED":
            statusClass = "alert-danger";
            statusHtml = `
                        <p><strong>Trạng thái:</strong> <span class="badge bg-danger">Bị từ chối</span></p>
                        <p><strong>Lý do:</strong> ${
                          data.adminNote || "Chưa có ghi chú từ admin"
                        }</p>
                        <p>Bạn có thể nộp lại đơn ứng tuyển sau khi khắc phục các vấn đề.</p>
                    `;
            break;
        }

        statusContainer.style.display = "block";
        statusContainer.querySelector(
          ".alert"
        ).className = `alert ${statusClass}`;
        statusContent.innerHTML = statusHtml;
      }

      async function loadSubjects() {
        try {
          const token = getAuthToken();
          const response = await fetch("/api/student/become-tutor/subjects", {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const data = await response.json();

          if (data.success) {
            renderSubjects(data.subjects);
          }
        } catch (error) {
          console.error("Error loading subjects:", error);
        }
      }

      function renderSubjects(subjects) {
        const container = document.getElementById("subjectsContainer");
        container.innerHTML = "";

        subjects.forEach((subject) => {
          const subjectDiv = document.createElement("div");
          subjectDiv.className = "col-md-4 col-sm-6";
          subjectDiv.innerHTML = `
                    <div class="subject-checkbox" data-subject-id="${subject.id}">
                        <input type="checkbox" class="form-check-input" id="subject_${subject.id}" value="${subject.id}">
                        <label class="form-check-label ms-2" for="subject_${subject.id}">
                            ${subject.name}
                        </label>
                    </div>
                `;
          container.appendChild(subjectDiv);

          // Add click event
          subjectDiv.addEventListener("click", function () {
            toggleSubject(subject.id, this);
          });
        });
      }

      function toggleSubject(subjectId, element) {
        const checkbox = element.querySelector('input[type="checkbox"]');
        checkbox.checked = !checkbox.checked;

        if (checkbox.checked) {
          element.classList.add("selected");
          selectedSubjects.push(subjectId);
        } else {
          element.classList.remove("selected");
          selectedSubjects = selectedSubjects.filter((id) => id !== subjectId);
        }
      }

      function changeStep(direction) {
        if (direction === 1 && !validateCurrentStep()) {
          return;
        }

        currentStep += direction;

        if (currentStep < 1) currentStep = 1;
        if (currentStep > totalSteps) currentStep = totalSteps;

        updateStepDisplay();
      }

      function validateCurrentStep() {
        const requiredFields = document.querySelectorAll(
          `#section${currentStep} [required]`
        );
        let isValid = true;

        requiredFields.forEach((field) => {
          if (!field.value.trim()) {
            field.classList.add("is-invalid");
            isValid = false;
          } else {
            field.classList.remove("is-invalid");
          }
        });

        if (currentStep === 3 && selectedSubjects.length === 0) {
          alert("Vui lòng chọn ít nhất một môn học");
          isValid = false;
        }

        return isValid;
      }

      function updateStepDisplay() {
        // Update step indicators
        for (let i = 1; i <= totalSteps; i++) {
          const step = document.getElementById(`step${i}`);
          const section = document.getElementById(`section${i}`);

          if (i < currentStep) {
            step.className = "step completed";
          } else if (i === currentStep) {
            step.className = "step active";
          } else {
            step.className = "step";
          }

          section.classList.toggle("active", i === currentStep);
        }

        // Update progress bar
        const progress = (currentStep / totalSteps) * 100;
        document.getElementById("progressBar").style.width = `${progress}%`;

        // Update buttons
        document.getElementById("prevBtn").style.display =
          currentStep > 1 ? "block" : "none";
        document.getElementById("nextBtn").style.display =
          currentStep < totalSteps ? "block" : "none";
        document.getElementById("submitBtn").style.display =
          currentStep === totalSteps ? "block" : "none";
      }

      // Form submission
      document
        .getElementById("becomeTutorForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          if (!validateCurrentStep()) {
            return;
          }

          await submitApplication();
        });

      async function submitApplication() {
        try {
          showLoadingModal();

          const formData = collectFormData();
          const token = getAuthToken();

          const response = await fetch("/api/student/become-tutor/apply", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify(formData),
          });

          const data = await response.json();
          hideLoadingModal();

          if (data.success) {
            alert(
              "Đăng ký thành công! Đơn ứng tuyển của bạn đang chờ admin duyệt."
            );
            window.location.reload();
          } else {
            alert("Có lỗi xảy ra: " + data.error);
          }
        } catch (error) {
          hideLoadingModal();
          console.error("Error submitting application:", error);
          alert("Có lỗi xảy ra khi gửi đăng ký");
        }
      }

      function collectFormData() {
        return {
          // Personal info
          dateOfBirth: document.getElementById("dateOfBirth").value || null,
          gender: document.getElementById("gender").value || null,
          phoneNumber: document.getElementById("phoneNumber").value,
          addressLine1: document.getElementById("addressLine1").value,
          city: document.getElementById("city").value,

          // Professional info
          bio: document.getElementById("bio").value,
          headline: document.getElementById("headline").value,
          experience: document.getElementById("experience").value,
          teachingLevel: document.getElementById("teachingLevel").value,
          fees: parseInt(document.getElementById("fees").value),
          university: document.getElementById("university").value,
          major: document.getElementById("major").value,
          educationLevel: document.getElementById("educationLevel").value,
          videoIntro: document.getElementById("videoIntro").value,

          // Subjects and schedules
          subjectIds: selectedSubjects,
          schedules: collectScheduleData(),
          educations: collectEducationData(),
          certificates: collectCertificateData(),
        };
      }

      function collectScheduleData() {
        const schedules = [];
        const scheduleItems = document.querySelectorAll(".schedule-item");

        scheduleItems.forEach((item) => {
          const dayOfWeek = item.querySelector('[name="dayOfWeek"]').value;
          const fromTime = item.querySelector('[name="fromTime"]').value;
          const toTime = item.querySelector('[name="toTime"]').value;
          const enable = item.querySelector('[name="enable"]').checked;

          if (dayOfWeek && fromTime && toTime) {
            schedules.push({
              dayOfWeek,
              fromTime,
              toTime,
              enable,
            });
          }
        });

        return schedules;
      }

      function collectEducationData() {
        const educations = [];
        const educationItems = document.querySelectorAll(".education-item");

        educationItems.forEach((item) => {
          const schoolName = item.querySelector('[name="schoolName"]').value;
          const degree = item.querySelector('[name="degree"]').value;
          const major = item.querySelector('[name="major"]').value;
          const fromTime = item.querySelector('[name="fromTime"]').value;
          const toTime = item.querySelector('[name="toTime"]').value;

          if (schoolName || degree) {
            educations.push({
              schoolName,
              degree,
              major,
              fromTime: fromTime ? parseInt(fromTime) : null,
              toTime: toTime ? parseInt(toTime) : null,
            });
          }
        });

        return educations;
      }

      function collectCertificateData() {
        const certificates = [];
        const certificateItems = document.querySelectorAll(".certificate-item");

        certificateItems.forEach((item) => {
          const name = item.querySelector('[name="name"]').value;
          const issuedBy = item.querySelector('[name="issuedBy"]').value;
          const description = item.querySelector('[name="description"]').value;

          if (name || issuedBy) {
            certificates.push({
              name,
              issuedBy,
              description,
            });
          }
        });

        return certificates;
      }

      // Helper functions for adding/removing items
      function addScheduleItem() {
        const container = document.getElementById("scheduleContainer");
        const newItem = document.createElement("div");
        newItem.className = "schedule-item";
        newItem.innerHTML = `
                <div class="row align-items-center">
                    <div class="col-md-3">
                        <select class="form-select" name="dayOfWeek">
                            <option value="MONDAY">Thứ 2</option>
                            <option value="TUESDAY">Thứ 3</option>
                            <option value="WEDNESDAY">Thứ 4</option>
                            <option value="THURSDAY">Thứ 5</option>
                            <option value="FRIDAY">Thứ 6</option>
                            <option value="SATURDAY">Thứ 7</option>
                            <option value="SUNDAY">Chủ nhật</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="time" class="form-control" name="fromTime" value="08:00">
                    </div>
                    <div class="col-md-3">
                        <input type="time" class="form-control" name="toTime" value="10:00">
                    </div>
                    <div class="col-md-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="enable" checked>
                            <label class="form-check-label">Có sẵn</label>
                        </div>
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeScheduleItem(this)">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        container.appendChild(newItem);
      }

      function removeScheduleItem(button) {
        const scheduleItem = button.closest(".schedule-item");
        if (document.querySelectorAll(".schedule-item").length > 1) {
          scheduleItem.remove();
        } else {
          alert("Phải có ít nhất một khung giờ");
        }
      }

      function addEducationItem() {
        const container = document.getElementById("educationContainer");
        const newItem = document.createElement("div");
        newItem.className = "education-item border rounded p-3 mb-3";
        newItem.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label">Tên trường</label>
                        <input type="text" class="form-control" name="schoolName">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Bằng cấp</label>
                        <input type="text" class="form-control" name="degree">
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-md-4">
                        <label class="form-label">Chuyên ngành</label>
                        <input type="text" class="form-control" name="major">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Năm bắt đầu</label>
                        <input type="number" class="form-control" name="fromTime" min="1990" max="2030">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Năm tốt nghiệp</label>
                        <input type="number" class="form-control" name="toTime" min="1990" max="2030">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="button" class="btn btn-outline-danger" onclick="removeEducationItem(this)">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        container.appendChild(newItem);
      }

      function removeEducationItem(button) {
        button.closest(".education-item").remove();
      }

      function addCertificateItem() {
        const container = document.getElementById("certificateContainer");
        const newItem = document.createElement("div");
        newItem.className = "certificate-item border rounded p-3 mb-3";
        newItem.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label">Tên chứng chỉ</label>
                        <input type="text" class="form-control" name="name">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Đơn vị cấp</label>
                        <input type="text" class="form-control" name="issuedBy">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="button" class="btn btn-outline-danger" onclick="removeCertificateItem(this)">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
                <div class="mt-2">
                    <label class="form-label">Mô tả</label>
                    <textarea class="form-control" name="description" rows="2"></textarea>
                </div>
            `;
        container.appendChild(newItem);
      }

      function removeCertificateItem(button) {
        button.closest(".certificate-item").remove();
      }

      // Utility functions
      function getAuthToken() {
        return (
          localStorage.getItem("jwt_token") ||
          sessionStorage.getItem("jwt_token")
        );
      }

      function showLoadingModal() {
        new bootstrap.Modal(document.getElementById("loadingModal")).show();
      }

      function hideLoadingModal() {
        bootstrap.Modal.getInstance(
          document.getElementById("loadingModal")
        )?.hide();
      }

      async function loadApplicationDetails() {
        try {
          const token = getAuthToken();
          const response = await fetch("/api/student/become-tutor/details", {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const data = await response.json();
          if (data.success) {
            // Show application details in modal or redirect to details page
            alert("Chi tiết đăng ký: " + JSON.stringify(data.profile, null, 2));
          }
        } catch (error) {
          console.error("Error loading application details:", error);
        }
      }
    </script>
  </body>
</html>
