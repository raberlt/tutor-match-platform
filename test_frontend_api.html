<!DOCTYPE html>
<html>
<head>
    <title>Test Frontend API</title>
</head>
<body>
    <h1>Test Frontend API Call</h1>
    <div id="result"></div>
    
    <script>
        async function testAPI() {
            try {
                const response = await fetch('/api/public/tutors?page=0&size=1');
                const data = await response.json();
                
                console.log('API Response:', data);
                console.log('First tutor:', data.content[0]);
                console.log('First tutor subjects:', data.content[0].subjects);
                
                document.getElementById('result').innerHTML = 
                    '<pre>' + JSON.stringify(data.content[0], null, 2) + '</pre>';
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        }
        
        testAPI();
    </script>
</body>
</html>
